name: Repository map
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    name: Links and generated map
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - run: python -I _tools/links.py
      - run: python -I _tools/map.py --check
      - run: python -I _tools/test_map.py
